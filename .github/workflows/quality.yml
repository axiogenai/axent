name: Quality checks

on:
  push:
    branches: ["main", "fix/axent-core-stability", "security/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build


  sql:
    name: Supabase SQL syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pglast
      - name: Parse baseline schema and migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          paths = [Path("frontend/supabase_schema.sql"), *sorted(Path("frontend/supabase_migrations").glob("*.sql"))]
          for path in paths:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"PASS: {path}")
          PY

  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-ci-secret-key-not-used-in-deployment
      SECURE_SSL_REDIRECT: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
